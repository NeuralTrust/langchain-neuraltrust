[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-neuraltrust"
dynamic = ["version"]
description = "LangChain middleware for NeuralTrust TrustGuard"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "NeuralTrust", email = "support@neuraltrust.ai" }]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/albertbausili/langchain-neuraltrust"
Repository = "https://github.com/albertbausili/langchain-neuraltrust"
Issues = "https://github.com/albertbausili/langchain-neuraltrust/issues"
Documentation = "https://neuraltrust.ai"

[dependency-groups]
test = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "respx>=0.22,<1.0",
]
lint = [
    "ruff>=0.9,<0.14",
]
typing = [
    "mypy>=1.14,<3.0",
]

[tool.hatch.version]
path = "langchain_neuraltrust/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["langchain_neuraltrust"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = [
    "D100",
    "D104",
    "D105",
    "D107",
    "D401",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-m", "not live"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits the production TrustGuard tenant (requires tests/integration_tests/.creds.json)",
]
