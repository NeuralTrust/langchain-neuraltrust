# Dev publish — push to develop builds and publishes to the DEV Artifact Registry.
# No GitHub Release is created.

name: Publish Dev

on:
  push:
    branches: [develop]
    paths-ignore:
      - ".github/**"
      - "README.md"

concurrency:
  group: publish-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: NeuralTrust/workflows/.github/workflows/python-publish.yml@ab9c0eda7ab13a6a7df5d04ecc048651c46c18cf
    with:
      gcp_project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
      build_tool: uv
      python_version: "3.12"
    secrets:
      WIF_PROVIDER: ${{ secrets.DEV_WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
