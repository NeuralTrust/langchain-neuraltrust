# Dev publish — push to develop uploads a wheel to TestPyPI.
# No GitHub Release is created.

name: Publish Dev

on:
  push:
    branches: [develop]
    paths-ignore:
      - ".github/**"
      - "README.md"

concurrency:
  group: publish-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: testpypi
      url: https://test.pypi.org/p/langchain-neuraltrust
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/unit_tests -q
      - run: uv build
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/
