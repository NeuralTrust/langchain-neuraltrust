# Build smoke for tags and manual runs. Publishing to Artifact Registry is
# wired in the NeuralTrust org via python-publish.yml once this repo moves.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv build
      - run: uv run pytest tests/unit_tests -q
